[workspace]
members = ["core", "cli", "pack"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "WTFPL"

[workspace.dependencies]
anyhow = "1.0.104"
bzip2 = "0.6.1"
qbsdiff = "1.4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Named release profile for the Windows build (woh.py picks it on Windows hosts). Same settings as `release`;
# a distinct name keeps its artifacts in their own target/ subdirectory. The Linux/Steam Deck build uses `release`.
[profile.win-msvc-release]
inherits = "release"
